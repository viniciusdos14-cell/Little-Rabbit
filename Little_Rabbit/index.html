<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cassino Coelho — CoinHop 🎰🐇</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="device" role="application" aria-label="Cassino Coelho">
    <header>
      <div class="logo">🐰</div>
      <div class="head-info">
        <p class="title">CoelhoCoin — CoinHop</p>
        <p class="subtitle">Cassino temático • Estilo Coin Master</p>
      </div>

      <div class="balance">
        <div class="coins">🪙 <strong>R$ 0,00</strong></div>
        <div class="small-tag">Nível: Conquistador</div>
      </div>
    </header>

    <main>
      <div class="playfield">
        <div class="tile rabbit">🐇</div>
        <div class="tile gold">🪙</div>
        <div class="tile chest">📦</div>

        <div class="tile rabbit">🐰</div>
        <div class="tile center gold">🎰</div>
        <div class="tile chest">🏆</div>

        <div class="tile rabbit">🥕</div>
        <div class="tile gold">✨</div>
        <div class="tile chest">💎</div>
      </div>

      <div class="controls">
        <button class="btn deposit">Depósito</button>
        <button class="btn spin">
          GIRAR! 🎰
        </button>
      </div>

      <p class="hint">Colete moedas, ataque vilarejos e desbloqueie o Coelho Lendário — apenas visual.</p>

      <div class="watermark">🐾</div>
    </main>

    <footer>Design inspirado: Coin Master • Tema: Coelho</footer>
  </div>
</body>
</html>
